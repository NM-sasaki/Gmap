<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>現場マップ（Leaflet 試用版）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;color:#222;background:#fff} #top{padding:8px;padding-top:max(8px,env(safe-area-inset-top));background:#f8f8f8;border-bottom:1px solid #ccc} #info{font-size:.9rem;min-height:1.4em;overflow-wrap:anywhere} .buttons{display:flex;gap:5px;margin-top:6px;align-items:stretch} button,select,a.nav{font:inherit;font-size:.85rem;padding:8px 5px;min-height:38px;border:1px solid #aaa;border-radius:5px;background:white;color:#222;text-align:center} .buttons>*{flex:1;min-width:0} button:disabled,a.nav[aria-disabled=true]{opacity:.45;pointer-events:none} a.nav{text-decoration:none;display:flex;align-items:center;justify-content:center} #map{flex:1;min-height:0} #status{font-size:.75rem;color:#555;overflow-wrap:anywhere} #status:empty{display:none} .leaflet-tooltip.site-label{background:none;border:0;box-shadow:none;padding:0;color:#111;font-size:11px;font-weight:500;text-shadow:-1px -1px 0 white,1px -1px 0 white,-1px 1px 0 white,1px 1px 0 white;pointer-events:none} .leaflet-tooltip.site-label:before{display:none} .leaflet-tooltip.site-label.selected{color:#d32f2f;font-size:13px;font-weight:700;z-index:1000} .pin{background:none;border:0} .pin svg{display:block;filter:drop-shadow(0 1px 1px #0005)} dialog{width:min(94vw,520px);max-height:80vh;border:1px solid #aaa;border-radius:10px;padding:14px} dialog::backdrop{background:#0006} .hidden-row{display:flex;gap:8px;align-items:center;border-bottom:1px solid #ddd;padding:8px 0} .hidden-row div{flex:1;min-width:0;overflow-wrap:anywhere} .hidden-row small{display:block;color:#555} #hiddenList{max-height:50vh;overflow:auto} h2{font-size:1.1rem;margin:0 0 8px} .leaflet-control-attribution{font-size:10px}
</style>
</head>
<body>
<div id="top">
<div id="info">選択中の地点：なし（マーカーをタップしてください）</div>
<div class="buttons"><a id="nav" class="nav" aria-disabled="true" target="_blank" rel="noopener">この地点へナビ</a><button id="toggle" disabled>選択地点を非表示</button><button id="locate">現在地</button></div>
<div class="buttons"><button id="hiddenBtn" disabled>非表示地点（0件）</button><select id="basemap" aria-label="背景地図"><option value="gsi">地理院地図</option><option value="osm">OpenStreetMap</option></select></div>
<div id="status" role="status"></div>
</div>
<div id="map" aria-label="訪問先地図"></div>
<dialog id="hiddenDialog"><h2 id="hiddenTitle">非表示地点</h2><div id="hiddenList"></div><div class="buttons"><button id="restoreAll">全地点を再表示</button><button id="closeDialog">閉じる</button></div></dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const KEY='gmap_hidden_location_ids';
let map, activeLayer, currentLocation, selected=null, locations=[], hidden=new Set(), storageFailed=false;
function status(message){$('status').textContent=message;}
function loadHidden(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return new Set(Array.isArray(a)?a:[]);}catch(e){storageFailed=true;return new Set();}}
function saveHidden(){try{localStorage.setItem(KEY,JSON.stringify([...hidden]));}catch(e){storageFailed=true;status('非表示状態を端末に保存できませんでした。');}}
function textNode(text){const el=document.createElement('span');el.textContent=text;return el;}
function makePin(){return L.divIcon({className:'pin',html:'<svg xmlns="http://www.w3.org/2000/svg" width="24" height="34" viewBox="0 0 24 34"><path d="M12 33C9 25 1 19 1 12a11 11 0 1 1 22 0c0 7-8 13-11 21z" fill="#e5443e" stroke="#a52a24"/><circle cx="12" cy="12" r="4" fill="#8d2420"/></svg>',iconSize:[24,34],iconAnchor:[12,33],tooltipAnchor:[0,-33]});}
function appearance(loc){const chosen=loc===selected;loc.marker.setZIndexOffset(chosen?1000:0);loc.marker.setTooltipContent(textNode((chosen?'★ ':'')+loc.name));const el=loc.marker.getTooltip().getElement();if(el)el.classList.toggle('selected',chosen);}
function show(loc){loc.marker.addTo(map);appearance(loc);}
function select(loc){const previous=selected;selected=loc;if(previous)appearance(previous);if(loc)appearance(loc);updateUI();}
function updateUI(){const loc=selected;const isHidden=loc&&hidden.has(loc.id);$('info').textContent=loc?'選択中の地点： '+loc.name+' ／ '+loc.address+(isHidden?' ※非表示中':''):'選択中の地点：なし（マーカーをタップしてください）';$('toggle').disabled=!loc;$('toggle').textContent=isHidden?'選択地点を再表示':'選択地点を非表示';const nav=$('nav');if(loc&&!isHidden){nav.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(loc.lat+','+loc.lng)+'&travelmode=driving&dir_action=navigate';nav.setAttribute('aria-disabled','false');}else{nav.removeAttribute('href');nav.setAttribute('aria-disabled','true');}const count=locations.filter(l=>hidden.has(l.id)).length;$('hiddenBtn').textContent='非表示地点（'+count+'件）';$('hiddenBtn').disabled=false;if($('hiddenDialog').open)renderHidden();}
function setHidden(loc,value){if(value){hidden.add(loc.id);loc.marker.remove();}else{hidden.delete(loc.id);show(loc);}saveHidden();updateUI();}
function renderHidden(){const list=$('hiddenList');list.replaceChildren();const items=locations.filter(l=>hidden.has(l.id));$('hiddenTitle').textContent='非表示地点（'+items.length+'件）';$('restoreAll').disabled=!items.length;if(!items.length){list.textContent='非表示地点はありません。';return;}for(const loc of items){const row=document.createElement('div');row.className='hidden-row';const info=document.createElement('div');info.append(textNode(loc.name));const small=document.createElement('small');small.textContent=loc.address;info.append(small);const btn=document.createElement('button');btn.textContent='再表示';btn.onclick=()=>setHidden(loc,false);row.append(info,btn);list.append(row);}}
function fitVisible(){const points=locations.filter(l=>!hidden.has(l.id)).map(l=>[l.lat,l.lng]);if(points.length)map.fitBounds(points,{padding:[20,20],maxZoom:15});}
function locate(){if(!navigator.geolocation){status('位置情報を利用できません。');return;}$('locate').disabled=true;status('現在地を取得中…');navigator.geolocation.getCurrentPosition(pos=>{const p=[pos.coords.latitude,pos.coords.longitude];if(!currentLocation)currentLocation=L.circleMarker(p,{radius:7,color:'#fff',weight:2,fillColor:'#4285f4',fillOpacity:1,interactive:false}).addTo(map);else currentLocation.setLatLng(p);map.setView(p,14);$('locate').disabled=false;status(storageFailed?'非表示状態の端末保存に問題があります。':'');},err=>{$('locate').disabled=false;status('現在地を取得できません：'+err.message);},{enableHighAccuracy:true,timeout:10000,maximumAge:0});}
async function init(){if(typeof L==='undefined')throw Error('Leafletを読み込めません。インターネット接続を確認してください。');map=L.map('map',{minZoom:5,maxZoom:18}).setView([36.2,140.2],8);const layers={gsi:L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{minZoom:5,maxZoom:18,attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>'}),osm:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>'})};for(const layer of Object.values(layers))layer.on('tileerror',()=>{if(layer===activeLayer)status('背景地図の一部を取得できません。通信状況または別の背景地図を確認してください。');});activeLayer=layers.gsi.addTo(map);$('basemap').onchange=()=>{map.removeLayer(activeLayer);activeLayer=layers[$('basemap').value].addTo(map);status(storageFailed?'非表示状態の端末保存に問題があります。':'');};$('locate').onclick=locate;$('toggle').onclick=()=>{if(selected)setHidden(selected,!hidden.has(selected.id));};$('hiddenBtn').onclick=()=>{renderHidden();$('hiddenDialog').showModal();};$('closeDialog').onclick=()=>$('hiddenDialog').close();$('restoreAll').onclick=()=>{if(!confirm('すべての非表示地点を再表示しますか？'))return;for(const loc of locations){if(hidden.delete(loc.id))show(loc);}saveHidden();updateUI();fitVisible();};hidden=loadHidden();status('地点データを読み込み中…');const res=await fetch('locations.json',{cache:'no-store'});if(!res.ok)throw Error('locations.json を取得できません（HTTP '+res.status+'）');const data=await res.json();if(!Array.isArray(data))throw Error('locations.json の形式が不正です。');const ids=new Set();for(const d of data){if(!d||!['number','string'].includes(typeof d.id)||ids.has(d.id)||typeof d.name!=='string'||typeof d.address!=='string'||!Number.isFinite(d.lat)||!Number.isFinite(d.lng)||Math.abs(d.lat)>90||Math.abs(d.lng)>180)throw Error('地点データに不正な項目または重複IDがあります。');ids.add(d.id);}const icon=makePin();locations=data.map(d=>{const loc={...d,marker:L.marker([d.lat,d.lng],{icon,title:d.name,alt:d.name})};loc.marker.bindTooltip(textNode(d.name),{permanent:true,direction:'top',className:'site-label',opacity:1});loc.marker.on('click',()=>select(loc));loc.marker.on('tooltipopen',()=>appearance(loc));return loc;});for(const loc of locations)if(!hidden.has(loc.id))show(loc);fitVisible();updateUI();status(storageFailed?'非表示状態の端末保存に問題があります。':'');}
init().catch(err=>{console.error(err);status('エラー：'+err.message+(location.protocol==='file:'?' HTMLを直接開かず、GitHub Pagesで開いてください。':''));});
</script>
</body>
</html>
