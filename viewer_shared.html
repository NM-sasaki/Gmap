<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;color:#222;background:#fff} #top{padding:8px;padding-top:max(8px,env(safe-area-inset-top));background:#f8f8f8;border-bottom:1px solid #ccc} #info{font-size:.9rem;min-height:1.4em;overflow-wrap:anywhere} .buttons{display:flex;gap:5px;margin-top:6px;align-items:stretch} button,select,a.nav{font:inherit;font-size:.85rem;padding:8px 5px;min-height:38px;border:1px solid #aaa;border-radius:5px;background:white;color:#222;text-align:center} .buttons>*{flex:1;min-width:0} button:disabled,a.nav[aria-disabled=true]{opacity:.45;pointer-events:none} a.nav{text-decoration:none;display:flex;align-items:center;justify-content:center} #map{flex:1;min-height:0} #status{font-size:.75rem;color:#555;overflow-wrap:anywhere} #status:empty{display:none} .leaflet-tooltip.site-label{background:none;border:0;box-shadow:none;padding:0;color:#111;font-size:11px;font-weight:500;text-shadow:-1px -1px 0 white,1px -1px 0 white,-1px 1px 0 white,1px 1px 0 white;pointer-events:none} .leaflet-tooltip.site-label:before{display:none} .leaflet-tooltip.site-label.selected{color:#d32f2f;font-size:13px;font-weight:700;z-index:1000} .pin{background:none;border:0} .pin svg{display:block;filter:drop-shadow(0 1px 1px #0005)} dialog{width:min(94vw,520px);max-height:80vh;border:1px solid #aaa;border-radius:10px;padding:14px} dialog::backdrop{background:#0006} .hidden-row{display:flex;gap:8px;align-items:center;border-bottom:1px solid #ddd;padding:8px 0} .hidden-row div{flex:1;min-width:0;overflow-wrap:anywhere} .hidden-row small{display:block;color:#555} #hiddenList{max-height:50vh;overflow:auto} h2{font-size:1.1rem;margin:0 0 8px} .leaflet-control-attribution{font-size:10px}
</style>
<style>input{font:inherit;width:100%;padding:9px;border:1px solid #aaa;border-radius:5px}label{display:block;margin:8px 0}#sync{font-size:.78rem;color:#555}#editHint{font-size:.85rem;color:#934b00}#loginBox{padding:12px;max-width:480px;width:100%;margin:auto}[hidden]{display:none!important}button.danger{color:#a21b1b}#editor p{font-size:.85rem}#status{color:#8b3100}#top .buttons{flex-wrap:wrap}.buttons>*{min-width:75px} </style></head><body>
<section id="loginBox"><h2>現場マップ 共有版</h2><p id="loginMessage">Firebase設定を確認しています…</p><form id="loginForm" hidden><label>メールアドレス<input id="email" type="email" autocomplete="username" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><button id="loginBtn">ログイン</button></form></section>
<div id="top" hidden><div id="info">地点を選択してください</div><div id="sync">同期準備中</div><div class="buttons"><a id="nav" class="nav" aria-disabled="true" target="_blank" rel="noopener">この地点へナビ</a><button id="toggle" disabled>非表示</button><button id="locate">現在地</button></div><div class="buttons"><button id="hiddenBtn">非表示地点（0件）</button><select id="basemap"><option value="gsi">地理院地図</option><option value="osm">OpenStreetMap</option></select><button id="manage">地点管理</button></div><div id="management" hidden><div class="buttons"><button id="add">地点追加</button><button id="edit">名称・住所編集</button><button id="move">位置移動</button><button id="delete" class="danger">削除</button></div><div class="buttons"><button id="csv">CSV一括登録</button><button id="import">既存JSON取込（初回）</button><button id="export">JSONバックアップ</button><button id="logout">ログアウト</button></div><div id="editHint"></div><div class="buttons" id="moveActions" hidden><button id="saveMove">位置を保存</button><button id="cancelMove">取消</button></div></div><div id="status" role="status"></div></div>
<div id="map" hidden></div>
<dialog id="hiddenDialog"><h2>非表示地点</h2><div id="hiddenList"></div><div class="buttons"><button id="restoreAll">全地点を再表示</button><button id="closeHidden">閉じる</button></div></dialog>
<dialog id="editor"><h2 id="editorTitle">地点追加</h2><form id="editForm"><label>名称<input id="siteName" maxlength="200" required></label><label>住所<input id="siteAddress" maxlength="500" required></label><p id="coordHint"></p><div class="buttons"><button type="button" id="geoSearch">住所から位置を検索</button><button type="button" id="searchAddress">Googleマップで住所を確認</button><button type="button" id="pick">地図で位置を指定</button></div><div class="buttons"><button id="saveSite">保存</button><button type="button" id="cancelEdit">取消</button></div></form></dialog>
<dialog id="csvDialog"><h2>CSV一括登録</h2><p>名称・住所だけを検索します。既存地点は変更しません。検索結果は概略位置です。各行の地図確認後に登録してください。</p><input type="file" id="csvFile" accept=".csv,text/csv"><p id="csvStatus" role="status"></p><div id="csvRows" style="max-height:45vh;overflow:auto"></div><div class="buttons"><button id="csvCommit" disabled>確認済み地点を登録</button><button id="csvClose">閉じる</button></div><p style="font-size:.75rem">住所検索：<a href="https://github.com/geolonia/community-geocoder" target="_blank" rel="noopener">Geolonia Community Geocoder</a>（国土交通省 位置参照情報）</p></dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,doc,getDoc,getDocsFromServer,onSnapshot,runTransaction,writeBatch,updateDoc,deleteDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const $=id=>document.getElementById(id); let auth,db,map,layer,current,unsubscribe,selected=null,sites=new Map(),markers=new Map(),ready=false,busy=false,moveId=null,draft=null,picking=false,preview=null,first=true,connected=false;
const status=t=>$('status').textContent=t; const ref=id=>doc(db,'sites',id); const meta=()=>doc(db,'settings','migration');
function node(t){const n=document.createElement('span');n.textContent=t;return n;}
function pin(chosen=false){return L.divIcon({className:'pin',html:`<svg width="24" height="34" viewBox="0 0 24 34"><path d="M12 33C9 25 1 19 1 12a11 11 0 1 1 22 0c0 7-8 13-11 21z" fill="${chosen?'#2376d2':'#e5443e'}" stroke="#773333"/><circle cx="12" cy="12" r="4" fill="#fff"/></svg>`,iconSize:[24,34],iconAnchor:[12,33],tooltipAnchor:[0,-33]});}
function initMap(){if(map){map.invalidateSize();return;}map=L.map('map',{maxZoom:18,minZoom:5}).setView([36.2,140.2],8);const layers={gsi:L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{maxZoom:18,attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>'}),osm:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'})};layer=layers.gsi.addTo(map);$('basemap').onchange=()=>{map.removeLayer(layer);layer=layers[$('basemap').value].addTo(map);};map.on('click',e=>{if(!picking)return;draft.lat=e.latlng.lat;draft.lng=e.latlng.lng;picking=false;clearPreview();showDraftPin();status('');openEditor();ui();});}
function clearPreview(){if(preview){preview.remove();preview=null;}}
function render(){for(const [id,m] of markers){if(!sites.has(id)||sites.get(id).hidden){m.remove();markers.delete(id);}}for(const [id,s] of sites){if(s.hidden)continue;let m=markers.get(id);if(!m){m=L.marker([s.lat,s.lng],{icon:pin(id===selected),draggable:false}).addTo(map);m.bindTooltip(node(s.name),{permanent:true,direction:'top',className:'site-label',opacity:1});m.on('click',()=>{if(picking||moveId)return;selected=id;render();});markers.set(id,m);}if(moveId!==id)m.setLatLng([s.lat,s.lng]);m.setIcon(pin(id===selected));m.setZIndexOffset(id===selected?1000:0);m.setTooltipContent(node((id===selected?'★ ':'')+s.name));m.getTooltip().getElement()?.classList.toggle('selected',id===selected);}if(selected&&!sites.has(selected))selected=null;ui();}
function fit(){const pts=[...sites.values()].filter(s=>!s.hidden).map(s=>[s.lat,s.lng]);if(pts.length)map.fitBounds(pts,{padding:[25,25],maxZoom:15});}
function ui(){const s=sites.get(selected),locked=busy||!ready||!connected||!!moveId||picking;$('info').textContent=s?`選択中：${s.name} ／ ${s.address}${s.hidden?' ※非表示中':''}`:'選択中の地点：なし';$('toggle').textContent=s?.hidden?'再表示':'非表示';$('toggle').disabled=locked||!s;for(const id of ['edit','move','delete'])$(id).disabled=locked||!s||(id==='move'&&s.hidden);for(const id of ['add','import','csv','restoreAll'])$(id).disabled=locked;$('export').disabled=!ready||busy;$('saveMove').disabled=busy||!connected||!moveId;$('hiddenBtn').textContent=`非表示地点（${[...sites.values()].filter(s=>s.hidden).length}件）`;$('nav').removeAttribute('href');$('nav').setAttribute('aria-disabled','true');if(s&&!s.hidden&&!moveId&&!picking){$('nav').href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(s.lat+','+s.lng)+'&travelmode=driving&dir_action=navigate';$('nav').setAttribute('aria-disabled','false');}if($('hiddenDialog').open)renderHidden();}
async function action(fn){if(busy||!ready||!connected)return false;busy=true;ui();status('保存中…');try{await fn();status('');return true;}catch(e){status('操作失敗：'+e.message);return false;}finally{busy=false;ui();}}
function renderHidden(){const box=$('hiddenList');box.replaceChildren();for(const [id,s] of sites){if(!s.hidden)continue;const row=document.createElement('div');row.className='hidden-row';const text=document.createElement('div');text.textContent=s.name+' ／ '+s.address;const b=document.createElement('button');b.textContent='再表示';b.disabled=busy||!connected||!!moveId||picking;b.onclick=()=>action(()=>updateDoc(ref(id),{hidden:false,updatedAt:serverTimestamp()}));row.append(text,b);box.append(row);}if(!box.children.length)box.textContent='非表示地点はありません。';}
function openEditor(){$('editorTitle').textContent=draft.id?'名称・住所編集':'地点追加';$('siteName').value=draft.name;$('siteAddress').value=draft.address;$('coordHint').textContent=Number.isFinite(draft.lat)?`座標：${draft.lat.toFixed(6)}, ${draft.lng.toFixed(6)}`:'地図上で位置を指定してください。';$('pick').hidden=!!draft.id;$('geoSearch').hidden=!!draft.id;$('saveSite').textContent=draft.csvRow?'この位置を確認':'保存';$('editor').showModal();}
function readDraft(){draft.name=$('siteName').value.trim();draft.address=$('siteAddress').value.trim();}
function endMove(){if(moveId){const m=markers.get(moveId);m?.dragging.disable();moveId=null;}$('moveActions').hidden=true;$('editHint').textContent='';render();}
$('moveActions').hidden=true;$('manage').onclick=()=>{$('management').hidden=!$('management').hidden;if($('management').hidden){if(moveId)endMove();if(picking){const row=draft?.csvRow;picking=false;draft=null;clearPreview();status('');ui();if(row)openCsv();}}};$('add').onclick=()=>{draft={id:null,name:'',address:'',lat:null,lng:null};openEditor();};$('edit').onclick=()=>{const s=sites.get(selected);if(!s)return;draft={...s,id:selected};openEditor();};$('cancelEdit').onclick=()=>{const row=draft?.csvRow;$('editor').close();draft=null;clearPreview();if(row)openCsv();};$('editor').addEventListener('cancel',e=>{e.preventDefault();$('cancelEdit').click();});$('searchAddress').onclick=()=>{readDraft();if(!draft.address)return;window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(draft.address),'_blank','noopener');};
$('pick').onclick=()=>{readDraft();$('editor').close();picking=true;status('地図をタップして登録位置を指定してください。地点管理を閉じると取消できます。');ui();};
$('editForm').onsubmit=async e=>{e.preventDefault();readDraft();if(!draft.name||!draft.address||!Number.isFinite(draft.lat)||!Number.isFinite(draft.lng)){ $('coordHint').textContent='名称・住所・地図上の位置を指定してください。';return;}const d={...draft};if(d.csvRow){Object.assign(d.csvRow,{name:d.name,address:d.address,lat:d.lat,lng:d.lng,state:'確認済み'});$('editor').close();draft=null;clearPreview();openCsv();return;}const dup=[...sites].some(([id,s])=>id!==d.id&&s.name.trim()===d.name&&s.address.trim()===d.address);if(dup){$('coordHint').textContent='同じ名称・住所の地点が登録済みです。';return;}$('saveSite').disabled=true;const ok=await action(async()=>{if(d.id)await updateDoc(ref(d.id),{name:d.name,address:d.address,updatedAt:serverTimestamp()});else{const r=doc(collection(db,'sites'));await runTransaction(db,async tx=>{const initial=await tx.get(meta());if(!initial.exists())tx.set(meta(),{importedAt:serverTimestamp(),count:0});tx.set(r,{name:d.name,address:d.address,lat:d.lat,lng:d.lng,hidden:false,updatedAt:serverTimestamp()});});selected=r.id;}});$('saveSite').disabled=false;if(ok){$('editor').close();draft=null;clearPreview();render();}else $('coordHint').textContent='保存できませんでした。通信・権限を確認してください。';};
$('move').onclick=()=>{if(!markers.has(selected))return;moveId=selected;markers.get(moveId).dragging.enable();$('moveActions').hidden=false;$('editHint').textContent='マーカーをドラッグし、「位置を保存」を押してください。住所は変更されません。';ui();};$('cancelMove').onclick=endMove;$('saveMove').onclick=async()=>{const id=moveId,m=markers.get(id);if(!m)return endMove();const p=m.getLatLng();if(await action(()=>updateDoc(ref(id),{lat:p.lat,lng:p.lng,updatedAt:serverTimestamp()})))endMove();};$('delete').onclick=()=>{const id=selected,s=sites.get(id);if(s&&confirm(`「${s.name}」を全端末から削除しますか？`))action(()=>deleteDoc(ref(id)));};$('toggle').onclick=()=>{const s=sites.get(selected);if(s)action(()=>updateDoc(ref(selected),{hidden:!s.hidden,updatedAt:serverTimestamp()}));};$('hiddenBtn').onclick=()=>{renderHidden();$('hiddenDialog').showModal();};$('closeHidden').onclick=()=>$('hiddenDialog').close();$('restoreAll').onclick=()=>{if(!confirm('全端末で非表示地点を再表示しますか？'))return;action(async()=>{const ids=[...sites].filter(([,s])=>s.hidden).map(([id])=>id);for(let i=0;i<ids.length;i+=400){const b=writeBatch(db);for(const id of ids.slice(i,i+400))b.update(ref(id),{hidden:false,updatedAt:serverTimestamp()});await b.commit();}});};$('locate').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{const xy=[p.coords.latitude,p.coords.longitude];if(!current)current=L.circleMarker(xy,{radius:7,color:'#fff',fillColor:'#4285f4',fillOpacity:1}).addTo(map);else current.setLatLng(xy);map.setView(xy,15);},e=>status('現在地取得失敗：'+e.message),{enableHighAccuracy:true,timeout:10000});
$('import').onclick=()=>{$('importFile').value='';$('importFile').click();};$('importFile').onchange=async()=>{const f=$('importFile').files[0];if(!f)return;try{const arr=JSON.parse(await f.text());if(!Array.isArray(arr)||!arr.length||arr.length>450)throw Error('1〜450件のJSON配列が必要です。');const ids=new Set(),rows=arr.map(s=>{const id='legacy_'+String(s.id);if(!/^legacy_[A-Za-z0-9_-]+$/.test(id)||ids.has(id)||typeof s.name!=='string'||!s.name.trim()||s.name.length>200||typeof s.address!=='string'||!s.address.trim()||s.address.length>500||!Number.isFinite(s.lat)||!Number.isFinite(s.lng)||Math.abs(s.lat)>90||Math.abs(s.lng)>180)throw Error('ID重複または不正な地点があります。');ids.add(id);return {id,name:s.name,address:s.address,lat:s.lat,lng:s.lng,hidden:false};});if(sites.size)throw Error('初回の空データベース専用です。');if(!confirm(`${rows.length}件を初回登録します。座標の利用・保存権限を確認済みですか？ 端末別非表示状態は引き継ぎません。`))return;await action(()=>runTransaction(db,async tx=>{if((await tx.get(meta())).exists())throw Error('初回取込済みです。');for(const row of rows){const {id,...s}=row;tx.set(ref(id),{...s,updatedAt:serverTimestamp()});}tx.set(meta(),{importedAt:serverTimestamp(),count:rows.length});}));fit();}catch(e){status(e.message);}};
$('export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify([...sites].map(([id,s])=>({id,name:s.name,address:s.address,lat:s.lat,lng:s.lng,hidden:s.hidden})),null,2)],{type:'application/json'}));a.href=url;a.download='locations_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};$('logout').onclick=()=>signOut(auth);
async function boot(){try{const res=await fetch('firebase-config.json',{cache:'no-store'});if(!res.ok)throw Error('firebase-config.json が見つかりません。');const cfg=await res.json();if(!cfg.apiKey||cfg.apiKey.startsWith('YOUR_')||!cfg.projectId)throw Error('Firebase設定値を入力してください。');const app=initializeApp(cfg);auth=getAuth(app);db=getFirestore(app);$('loginForm').hidden=false;$('loginMessage').textContent='登録済みの利用者でログインしてください。';$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);$('password').value='';}catch(e){$('loginMessage').textContent='ログイン失敗：'+e.code;}finally{$('loginBtn').disabled=false;}};onAuthStateChanged(auth,async user=>{unsubscribe?.();unsubscribe=null;for(const id of ['editor','hiddenDialog','csvDialog'])if($(id).open)$(id).close();$('moveActions').hidden=true;$('editHint').textContent='';ready=false;connected=false;first=true;sites.clear();selected=null;moveId=null;picking=false;draft=null;busy=false;csvEpoch++;csvRows=[];csvRunning=false;clearPreview();for(const m of markers.values())m.remove();markers.clear();$('top').hidden=true;$('map').hidden=true;$('loginBox').hidden=false;if(!user)return;try{const member=await getDoc(doc(db,'members',user.uid));if(!member.exists()||member.data().enabled!==true)throw Error('この利用者は許可されていません。');if(auth.currentUser?.uid!==user.uid)return;$('loginBox').hidden=true;$('top').hidden=false;$('map').hidden=false;initMap();unsubscribe=onSnapshot(collection(db,'sites'),{includeMetadataChanges:true},snap=>{sites=new Map(snap.docs.map(d=>[d.id,d.data()]));connected=!snap.metadata.fromCache;ready=true;if(moveId&&(!sites.has(moveId)||sites.get(moveId).hidden))endMove();$('sync').textContent=snap.metadata.hasPendingWrites?'変更を送信中…':connected?'クラウド同期済み':'オフライン／再接続待ち';render();if(first&&connected){first=false;fit();}},e=>{ready=false;connected=false;status('同期エラー：'+e.message);ui();});}catch(e){$('loginMessage').textContent=e.message;await signOut(auth);}});}catch(e){$('loginMessage').textContent=e.message;}}

// Address search and reviewed CSV import. Only original address is stored.
let geoLoader, csvRows=[],csvRunning=false,csvEpoch=0;
function loadGeocoder(){if(typeof window.getLatLng==='function')return Promise.resolve();if(!geoLoader)geoLoader=new Promise((resolve,reject)=>{const tag=document.createElement('script');tag.src='https://cdn.geolonia.com/community-geocoder.js';const timer=setTimeout(()=>{tag.remove();reject(Error('住所検索ライブラリの読込タイムアウト'));},15000);tag.onload=()=>{clearTimeout(timer);typeof window.getLatLng==='function'?resolve():reject(Error('住所検索関数がありません'));};tag.onerror=()=>{clearTimeout(timer);tag.remove();reject(Error('住所検索ライブラリを読み込めません'));};document.head.append(tag);}).catch(e=>{geoLoader=null;throw e;});return geoLoader;}
async function geocode(address){await loadGeocoder();return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('住所検索タイムアウト')),20000);try{window.getLatLng(address,r=>{clearTimeout(timer);if(!r||r.level<3||!Number.isFinite(r.lat)||!Number.isFinite(r.lng)||Math.abs(r.lat)>90||Math.abs(r.lng)>180)return reject(Error('町丁目まで特定できません'));resolve(r);},e=>{clearTimeout(timer);reject(Error('住所検索失敗'));});}catch(e){clearTimeout(timer);reject(e);}});}
function showDraftPin(){clearPreview();if(!draft||!Number.isFinite(draft.lat)||!Number.isFinite(draft.lng))return;preview=L.marker([draft.lat,draft.lng],{icon:pin(true),interactive:false}).addTo(map);}
$('geoSearch').onclick=async()=>{if(!draft)return;readDraft();if(!draft.address){$('coordHint').textContent='住所を入力してください。';return;}const d=draft,a=d.address;$('geoSearch').disabled=true;$('coordHint').textContent='住所を検索中…';try{const r=await geocode(a);if(draft!==d||$('siteAddress').value.trim()!==a)return;d.lat=r.lat;d.lng=r.lng;showDraftPin();map.setView([r.lat,r.lng],16);$('coordHint').textContent=`候補：${r.pref||''}${r.city||''}${r.town||''}（概略位置） 地図で位置を確認・修正してください。`; }catch(e){if(draft===d)$('coordHint').textContent=e.message+'。地図で位置を指定してください。';}finally{$('geoSearch').disabled=false;}};
$('siteAddress').addEventListener('input',()=>{if(draft&&!draft.id){draft.lat=null;draft.lng=null;clearPreview();$('coordHint').textContent='住所が変更されました。再検索または位置指定してください。';}});
function csvParse(text){const rows=[];let row=[],v='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){v+='"';i++;}else quoted=false;}else v+=c;}else if(c==='"'&&!v){quoted=true;}else if(c===','){row.push(v);v='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v='';}else v+=c;}if(quoted)throw Error('CSVの引用符が閉じていません');row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows;}
const norm=x=>x.normalize('NFKC').replace(/\s+/g,'').replace(/[‐‑‒–—−]/g,'-');
const keyOf=s=>JSON.stringify([norm(s.name),norm(s.address)]);
function openCsv(){renderCsv();if(!$('csvDialog').open)$('csvDialog').showModal();}
function renderCsv(){const el=$('csvRows');el.replaceChildren();for(const r of csvRows){const line=document.createElement('div');line.className='hidden-row';const desc=document.createElement('div');desc.textContent=r.name+' ／ '+r.address;const st=document.createElement('small');st.textContent=r.state+(r.detail?'：'+r.detail:'');desc.append(st);line.append(desc);if(!['既存・重複','登録済み','入力不正'].includes(r.state)){const b=document.createElement('button');b.textContent='地図確認・修正';b.disabled=csvRunning||busy;b.onclick=()=>{$('csvDialog').close();draft={id:null,name:r.name,address:r.address,lat:r.lat,lng:r.lng,csvRow:r};showDraftPin();if(Number.isFinite(r.lat))map.setView([r.lat,r.lng],16);openEditor();};line.append(b);}el.append(line);}const n=csvRows.filter(r=>r.state==='確認済み').length;$('csvCommit').disabled=csvRunning||busy||!connected||!n;$('csvCommit').textContent=`確認済み ${n}件を登録`;$('csvFile').disabled=csvRunning||busy;$('csvClose').disabled=busy;}
$('csv').onclick=openCsv;$('csvClose').onclick=()=>{$('csvDialog').close();};$('csvDialog').addEventListener('cancel',e=>{if(busy)e.preventDefault();});
$('csvFile').onchange=async()=>{const f=$('csvFile').files[0];if(!f||csvRunning||busy)return;if(csvRows.some(r=>!['登録済み','既存・重複'].includes(r.state))&&!confirm('未登録のCSV作業を置き換えますか？'))return;const epoch=++csvEpoch;csvRunning=true;try{if(f.size>2e6)throw Error('CSVは2MB以下にしてください');const bytes=await f.arrayBuffer();let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(bytes);}catch{ text=new TextDecoder('shift_jis').decode(bytes); }const rows=csvParse(text);const h=(rows.shift()||[]).map(x=>x.replace(/^\uFEFF/,'').trim().toLowerCase());const ni=h.findIndex(x=>['name','名称','会社名','地点名称'].includes(x)),ai=h.findIndex(x=>['address','住所','所在地'].includes(x));if(ni<0||ai<0)throw Error('ヘッダーは name,address または 名称,住所 が必要です');if(!rows.length||rows.length>450)throw Error('1〜450件のCSVを選択してください');const seen=new Set([...sites.values()].map(keyOf));csvRows=rows.map(row=>{const r={name:(row[ni]||'').trim(),address:(row[ai]||'').trim(),lat:null,lng:null,state:'検索待ち'};if(!r.name||!r.address||r.name.length>200||r.address.length>500)r.state='入力不正';else if(seen.has(keyOf(r)))r.state='既存・重複';else seen.add(keyOf(r));return r;});renderCsv();for(let i=0;i<csvRows.length;i++){if(epoch!==csvEpoch)return;const r=csvRows[i];$('csvStatus').textContent=`検索 ${i+1}/${csvRows.length}`;if(r.state!=='検索待ち')continue;try{const result=await geocode(r.address);if(epoch!==csvEpoch)return;r.lat=result.lat;r.lng=result.lng;r.state='要確認';r.detail=(result.pref||'')+(result.city||'')+(result.town||'');}catch(e){r.state='手動指定が必要';r.detail=e.message;}renderCsv();await new Promise(r=>setTimeout(r,350));} $('csvStatus').textContent='検索完了。各地点の地図確認・修正を行ってください。';}catch(e){$('csvStatus').textContent=e.message;}finally{if(epoch===csvEpoch){csvRunning=false;$('csvFile').value='';renderCsv();}}};
$('csvCommit').onclick=async()=>{const rows=csvRows.filter(r=>r.state==='確認済み');if(!rows.length||!confirm(`${rows.length}件の確認済み地点を登録しますか？`))return;await action(async()=>{const fresh=await getDocsFromServer(collection(db,'sites'));const seen=new Set(fresh.docs.map(d=>keyOf(d.data())));for(const r of rows){if(seen.has(keyOf(r))){r.state='既存・重複';continue;}const siteRef=doc(collection(db,'sites'));await runTransaction(db,async tx=>{const initial=await tx.get(meta());if(!initial.exists())tx.set(meta(),{importedAt:serverTimestamp(),count:0});tx.set(siteRef,{name:r.name,address:r.address,lat:r.lat,lng:r.lng,hidden:false,updatedAt:serverTimestamp()});});seen.add(keyOf(r));r.state='登録済み';} });renderCsv();};

boot();
</script></body></html>
