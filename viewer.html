<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>現場マップ（閲覧用）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #top {
      padding: 8px;
      border-bottom: 1px solid #ccc;
      background-color: #f8f8f8;
    }
    #info {
      font-size: 0.9rem;
      color: #444;
      min-height: 1.4em;
    }
    #buttons {
      display: flex;
      gap: 4px;
      margin-top: 6px;
    }
    #buttons button {
      flex: 1;
      font-size: 0.95rem;
      padding: 6px;
    }
    #map {
      flex: 1;
    }
    /* マーカーラベルのスタイル */
    .marker-label {
      font-size: 11px;
      font-weight: 500;
      text-shadow: -1px -1px 0 #fff,
                   1px -1px 0 #fff,
                   -1px  1px 0 #fff,
                    1px  1px 0 #fff;
      transform: translateY(-4px); /* 上に少し持ち上げ */
    }
  </style>
</head>
<body>
  <div id="top">
    <div id="info">選択中の地点：なし（マーカーをタップしてください）</div>
    <div id="buttons">
      <button id="navBtn" disabled>この地点へナビ</button>
      <button id="toggleBtn" disabled>選択地点を非表示</button>
      <button id="locateBtn">現在地</button>
    </div>
  </div>
  <div id="map"></div>

  <!-- Google Maps JavaScript API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAiQ9Qj69XkxbdSkcGEngomtInbYV_ajdE"></script>

  <script>
    let map;
    // locations: {id, name, address, lat, lng, marker, hidden}
    let locations = [];
    let selectedIndex = -1;
    let currentLocationMarker = null;

    const HIDDEN_STORAGE_KEY = "gmap_hidden_location_ids";

    function loadHiddenSet() {
      try {
        const text = localStorage.getItem(HIDDEN_STORAGE_KEY);
        if (!text) return new Set();
        const arr = JSON.parse(text);
        if (!Array.isArray(arr)) return new Set();
        return new Set(arr);
      } catch (_) {
        return new Set();
      }
    }

    function saveHiddenSet(set) {
      const arr = Array.from(set);
      try {
        localStorage.setItem(HIDDEN_STORAGE_KEY, JSON.stringify(arr));
      } catch (_) {
        // 保存に失敗しても致命的ではないので握りつぶす
      }
    }

    async function initMap() {
      try {
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 35.681236, lng: 139.767125 }, // 東京駅付近
          zoom: 5,
          gestureHandling: "greedy", // 指1本で地図を動かせるように
        });

        await loadLocations();
        setupUI();
      } catch (err) {
        console.error(err);
        alert("地点データの読み込みに失敗しました。");
      }
    }

    // locations.json を読み込んでマーカーを作成
    async function loadLocations() {
      const res = await fetch("locations.json", { cache: "no-store" });
      if (!res.ok) {
        throw new Error("locations.json の取得に失敗しました (status=" + res.status + ")");
      }
      const data = await res.json();
      if (!Array.isArray(data)) {
        throw new Error("locations.json の形式が不正です（配列ではありません）");
      }

      const hiddenSet = loadHiddenSet();
      const bounds = new google.maps.LatLngBounds();

      locations = data.map((loc, index) => {
        const position = { lat: loc.lat, lng: loc.lng };
        const isHidden = hiddenSet.has(loc.id);

        const marker = new google.maps.Marker({
          position,
          map: isHidden ? null : map, // 非表示ならマップに載せない
          title: loc.name,
          label: isHidden
            ? null
            : {
                text: loc.name,
                className: "marker-label",
              },
        });

        // マーカータップ → 選択するだけ（地図は動かさない／ナビもしない）
        marker.addListener("click", () => {
          selectLocation(index);
        });

        if (!isHidden) {
          bounds.extend(position);
        }

        return {
          id: loc.id,
          name: loc.name,
          address: loc.address,
          lat: loc.lat,
          lng: loc.lng,
          marker,
          hidden: isHidden,
        };
      });

      if (!bounds.isEmpty()) {
        map.fitBounds(bounds);
      }
    }

    function setupUI() {
      const navBtn = document.getElementById("navBtn");
      const toggleBtn = document.getElementById("toggleBtn");
      const locateBtn = document.getElementById("locateBtn");

      navBtn.addEventListener("click", () => {
        if (selectedIndex < 0) return;
        const loc = locations[selectedIndex];
        if (loc.hidden) return;
        openGoogleMapsForLocation(loc);
      });

      toggleBtn.addEventListener("click", () => {
        toggleSelectedLocationVisibility();
      });

      locateBtn.addEventListener("click", () => {
        showCurrentLocation();
      });

      updateButtonsState();
      updateInfo();
    }

    // マーカーから地点を選択
    function selectLocation(index) {
      selectedIndex = index;
      updateInfo();
      updateButtonsState();
      // 地図のパン・ズームは行わない
    }
    // ----------------------------------------------------
    // 標準マーカー(非選択時)
    // ----------------------------------------------------
    function setNormalMarkerAppearance(marker, name) {
      marker.setIcon(null); // default icon
      marker.setLabel({
        text: name,
        className: "marker-label",
      });
    }

    // ----------------------------------------------------
    // 選択時の強調マーカー
    // ----------------------------------------------------
    function setHighlightedMarkerAppearance(marker, name) {
      marker.setIcon({
        path: google.maps.SymbolPath.CIRCLE, // 円
        scale: 10,             // ★大きさ（通常の2〜3倍）
        fillColor: "#ff0000",  // ★赤
        fillOpacity: 1.0,
        strokeColor: "#ffffff",
        strokeWeight: 2,
      });

      marker.setLabel({
        text: name,
        className: "marker-label",
      });
    }

    // 上部の「選択中の地点」表示
    function updateInfo() {
      const info = document.getElementById("info");
      if (selectedIndex < 0 || !locations[selectedIndex]) {
        info.textContent = "選択中の地点：なし（マーカーをタップしてください）";
        return;
      }
      const loc = locations[selectedIndex];
      const suffix = loc.hidden ? " ※この地点は非表示中" : "";
      info.textContent =
        "選択中の地点： " + loc.name + " ／ " + loc.address + suffix;
    }

    function updateButtonsState() {
      const navBtn = document.getElementById("navBtn");
      const toggleBtn = document.getElementById("toggleBtn");

      if (selectedIndex < 0 || !locations[selectedIndex]) {
        navBtn.disabled = true;
        toggleBtn.disabled = true;
        toggleBtn.textContent = "選択地点を非表示";
        return;
      }

      const loc = locations[selectedIndex];

      // ナビボタン：非表示中は無効
      navBtn.disabled = loc.hidden;

      // トグルボタン：ラベル文言を切り替える
      toggleBtn.disabled = false;
      toggleBtn.textContent = loc.hidden ? "選択地点を再表示" : "選択地点を非表示";
    }

    // 選択中の地点の表示／非表示を切り替え（状態をlocalStorageに保存）
    function toggleSelectedLocationVisibility() {
      if (selectedIndex < 0) return;
      const loc = locations[selectedIndex];
      if (!loc) return;

      const hiddenSet = loadHiddenSet();

      if (loc.hidden) {
        // 再表示
        loc.hidden = false;
        if (loc.marker) {
          loc.marker.setMap(map);
          loc.marker.setLabel({
            text: loc.name,
            className: "marker-label",
          });
        }
        hiddenSet.delete(loc.id);
      } else {
        // 非表示
        loc.hidden = true;
        if (loc.marker) {
          loc.marker.setMap(null);
        }
        hiddenSet.add(loc.id);
      }

      saveHiddenSet(hiddenSet);
      updateButtonsState();
      updateInfo();
    }

    // Googleマップアプリ（またはブラウザ）で経路表示
    function openGoogleMapsForLocation(loc) {
      const url =
        "https://www.google.com/maps/dir/?api=1" +
        "&destination=" + encodeURIComponent(loc.lat + "," + loc.lng) +
        "&travelmode=driving";
      window.open(url, "_blank");
    }

    // 現在地を表示
    function showCurrentLocation() {
      if (!navigator.geolocation) {
        alert("この端末／ブラウザでは位置情報が利用できません。");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const position = { lat, lng };

          if (!currentLocationMarker) {
            currentLocationMarker = new google.maps.Marker({
              position,
              map,
              title: "現在地",
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 6,
                fillColor: "#4285F4",
                fillOpacity: 1,
                strokeColor: "#ffffff",
                strokeWeight: 2,
              },
            });
          } else {
            currentLocationMarker.setPosition(position);
          }

          map.panTo(position);
          map.setZoom(14);
        },
        (err) => {
          console.error(err);
          alert("現在地を取得できませんでした：" + err.message);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0,
        }
      );
    }

    // ページ読み込み完了後に initMap を呼ぶ
    window.addEventListener("load", initMap);
  </script>
</body>
</html>
